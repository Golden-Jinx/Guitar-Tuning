name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a new version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
          run_install: false
      - name: Check version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match package.json: v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm pack:win
      - run: pnpm smoke
      - name: Test portable EXE
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          node scripts/smoke-test.mjs "release/Stringroom-$version-Windows-x64-Portable.exe"
      - name: Package source and checksums
        run: |
          node scripts/source-archive.mjs
          pnpm checksums
          node scripts/checksums.mjs --verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stringroom-Windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*-Windows-x64-Portable.exe
            release/*-Windows-x64-Setup.exe
            release/*-Source.tar.gz
            release/SHA256SUMS.txt

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Stringroom-Windows-x64
          path: release
      - name: Verify files
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          cat > RELEASE_NOTES.md <<'NOTES'
          Windows 10 / 11 x64，可离线使用。

          - **Portable.exe**：免安装，双击运行
          - **Setup.exe**：安装版

          支持吉他、贝斯及自定义调弦。安装包未签名。

          ![Stringroom](https://raw.githubusercontent.com/Golden-Jinx/Guitar-Tuning/main/docs/preview.png)
          NOTES
          gh release create "$RELEASE_TAG" release/*-Windows-x64-Portable.exe release/*-Windows-x64-Setup.exe release/*-Source.tar.gz release/SHA256SUMS.txt --target "$RELEASE_COMMIT" --title "Stringroom $RELEASE_TAG" --notes-file RELEASE_NOTES.md
